<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="loginpage.css">
    <title>Login & Sign Up</title>
</head>
<body>
    <a href="./todopapge.html"> hello</a>
    <div class="container">
      
        <div class="form-section sign-up">
            <h2>Sign Up</h2>
            <form>
                <input type="text" id="fName" placeholder="Username" required>
                <input type="email" id="rEmail" placeholder="Email" required>
                <input type="password" id="rPassword" placeholder="Password" required>
                <button type="submit" id="submitSignUp">Sign Up</button>
            </form>
        </div>

      
        <div class="form-section log-in">
            <h2>Log In</h2>
            <form>
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <button type="submit"><a href="./todopapge.html">LOG in</a></button>
            </form>
        </div>
    </div>
    <script src="firbaceauth.js"></script>
</body>
</html>
